<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}Resume Screener{{end}} · Resume Screener</title>
  <meta name="description" content="Screen hundreds of resumes without reading every one. Go processes resumes in parallel; a local AI model reads, scores and ranks them, and you can chat with the whole pile.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="h-full font-sans text-sm text-gray-900 antialiased">
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex h-14 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
      <a href="/" class="flex items-center gap-2 font-semibold">
        <span class="flex h-8 w-8 items-center justify-center rounded-md bg-teal-600 text-white">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z"/></svg>
        </span>
        <span>Resume Screener</span>
      </a>
      <nav class="flex items-center gap-1">
        <a href="/" class="rounded-md px-3 py-2 font-medium {{if eq .Page "home"}}bg-teal-50 text-teal-700{{else}}text-gray-600 hover:bg-gray-100{{end}}">Jobs</a>
        <a href="/pipeline" class="rounded-md px-3 py-2 font-medium {{if eq .Page "pipeline"}}bg-teal-50 text-teal-700{{else}}text-gray-600 hover:bg-gray-100{{end}}">Live pipeline</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    {{with .Flash}}
    <div class="mb-6 rounded-lg border border-teal-200 bg-teal-50 px-4 py-3 text-teal-800" role="status">{{.}}</div>
    {{end}}
    {{template "content" .}}
  </main>

  <footer class="mx-auto max-w-7xl px-4 pb-10 text-xs text-gray-500 sm:px-6">
    Demo with made-up resumes only. AI runs on this server with Ollama ({{.ChatModel}} + {{.EmbedModel}}); no resume is sent to an outside service. Built with Go, MySQL and Tailwind.
  </footer>
</body>
</html>
