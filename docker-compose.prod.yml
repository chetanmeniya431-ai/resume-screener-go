# Production overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# In the server's .env set APP_BIND=127.0.0.1 so only the reverse proxy can reach the app.
services:
  app:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  db:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
