# Production overrides. Use with:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in the server .env, then: docker compose up -d --build
# In the server's .env set APP_BIND=127.0.0.1 so only the reverse proxy can reach the app.
services:
  app:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  db:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
